# Hand-formatted: tabs, "=" separators, odd indentation, Host * mid-file.

Host github gh
	HostName github.com
	User=git

  # a comment inside the file
Host *
  ServerAliveInterval 60
   Compression yes

Host vps
    HostName   vps.example.com
    port 2222
    IdentityFile ~/.ssh/a.pem
    IdentityFile ~/.ssh/b.pem

Match host *.internal
    User ops
