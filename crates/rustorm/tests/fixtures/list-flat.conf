Host *
    ServerAliveInterval 60

Host web-prod
    HostName webprod.example.com
    User web
    StrictHostKeyChecking no
    ProxyCommand ssh -W %h:%p bastion

Host github
    HostName github.com
    User git

Host vps
    HostName vps.example.com
    User root
    Port 2222
    IdentityFile ~/.ssh/vps.pem
