# ~/.ssh/config for the laptop
#   hand formatted, keep it that way

Include ~/.ssh/config.d/*

# the main box
Host vps v
    HostName vps.example.com
	User root
  Port 2222
        IdentityFile ~/.ssh/vps.pem

   # a comment inside the block
    IdentityFile ~/.ssh/second.pem


Host *
  ServerAliveInterval 60
  User emre

host github.com gh
	hostname github.com
	user git

Match host *.internal exec "test -f /tmp/vpn"
    ProxyJump bastion
    StrictHostKeyChecking no

Host web-prod
    HostName webprod.example.com
    ProxyCommand ssh -W %h:%p bastion
    FooBarUnknown yes
# trailing comment at end of file
