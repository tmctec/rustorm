# cargo-deny policy for rustorm. Run with `make licenses`.
#
# D20: no copyleft code, direct or transitive. GPL, LGPL, AGPL, SSPL, EUPL and
# CC-BY-SA crates are denied: cargo-deny rejects every license absent from the
# allow list below, and none of those licenses is on it. Never add them.

[graph]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OFL-1.1",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# egui's bundled fonts (Ubuntu-Light, Hack, emoji) carry the Ubuntu Font
# Licence, a font licence in the same class as OFL-1.1: its share-alike clause
# binds modified fonts only, never the program that embeds them. The exception
# names only that crate; the licence stays off the global allow list.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
